steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE
      - -f
      - fr-google-jukebox/Dockerfile
      - fr-google-jukebox

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE

  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy $_SERVICE \
        --project $PROJECT_ID \
        --image europe-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE \
        --allow-unauthenticated \
        --set-env-vars=PROJECT_ID=$PROJECT_ID \
        --update-secrets=GOOGLE_APP_EMAIL=GOOGLE_APP_EMAIL:latest,GOOGLE_APP_PASSWORD=GOOGLE_APP_PASSWORD:latest \
        --region $_REGION \
        --add-cloudsql-instances $_PROJECT_ID:$_REGION:$_SERVICE-instance \
        --timeout 3600 \
        --network=default \
        --subnet=default \
        --vpc-egress=private-ranges-only

images:
  - europe-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE

substitutions:
  _REPO: cookiecutter-template
  _SERVICE: "jukebox"
  _REGION: "europe-west1"

options:
  logging: CLOUD_LOGGING_ONLY